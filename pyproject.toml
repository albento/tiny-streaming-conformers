[project]
name = "tiny-streaming-conformers"
version = "1.0.0"
description = "Experiments of the paper: tiny streaming Conformers for real-time bird detection on low-resource acoustic recorders"
requires-python = ">=3.12,<3.13"
dependencies = [
  "polychirp",        # the PolyChirp benchmark (git submodule): TensorFlow 2.16, its baselines, data and evaluation code
  "torch>=2.8",       # our ViT
  "keras==3.13.2",   # PolyChirp's locked version (its data pipeline fails under 3.15)
  "python-dotenv",    # the folders of .env
  "pyyaml",
  "scipy",
]

[tool.uv]
package = false
# TensorFlow's NCCL (CUDA 12) and PyTorch's (CUDA 13) install the same file, nvidia/nccl/lib/libnccl.so.2:
# keep PyTorch's. TensorFlow only loads NCCL for multi-GPU training, never used here.
override-dependencies = ["nvidia-nccl-cu12 ; sys_platform == 'never'"]

[tool.uv.sources]
polychirp = { path = "polychirp", editable = true }
